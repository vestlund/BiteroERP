{% if sida.has_other_pages %}<p class="knappar liten-text">
  {% if sida.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'sida' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}sida={{ sida.previous_page_number }}">← Föregående</a>{% endif %}
  Sida {{ sida.number }} av {{ sida.paginator.num_pages }}
  {% if sida.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'sida' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}sida={{ sida.next_page_number }}">Nästa →</a>{% endif %}
</p>{% endif %}
