{% extends "base.html" %}
{% block innehall %}
<h1>{{ rubrik }}</h1>
<article>
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}
  <div class="formgrid">
  {% for f in form %}
    <label class="{% if f.field.widget.input_type == 'textarea' or f.name == 'anteckning' or f.name == 'meddelande' %}bred{% endif %}">
      {% if f.field.widget.input_type == "checkbox" %}{{ f }} {{ f.label }}{% else %}{{ f.label }}{{ f }}{% endif %}
      {% if f.help_text %}<small class="hjalp">{{ f.help_text }}</small>{% endif %}
      {{ f.errors }}
    </label>
  {% endfor %}
  </div>
  <div class="knappar">
    <button type="submit">Spara</button>
    <a href="javascript:history.back()" role="button" class="secondary outline">Avbryt</a>
    {% if radera %}<button type="submit" name="radera" value="1" class="secondary" onclick="return confirm('Radera?')">Radera</button>{% endif %}
  </div>
</form>
</article>
{% endblock %}
