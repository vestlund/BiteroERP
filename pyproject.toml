[project]
name = "konsultsystem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "django>=5.2,<6",
    "fpdf2>=2.9.0",
    "markdown>=3.11.2",
    "mcp>=1.10",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.4",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Vanliga fel (F, E, W), importordning (I), troliga buggar (B), Django-specifikt (DJ), föråldrad syntax (UP)
select = ["F", "E", "W", "I", "B", "DJ", "UP"]
# Stilfrågor som inte påverkar funktionen
ignore = ["E501", "E741", "B904", "B905", "DJ001", "DJ012"]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "*/migrations/*", "tester/*", "manage.py", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
skip_covered = true
fail_under = 75
sort = "Cover"
